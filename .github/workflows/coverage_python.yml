name: Python test coverage
run-name: Python test coverage triggered bt ${{ github.actor }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  label:
    types:
      - created
      - edited
      - deleted
  push:
    branches:
      - main
      - "**"
  schedule:
    - cron: "17 2 * * *"
jobs:
  run-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          pip install .
          pip install coverage
      - name: Run unittest
        run: |
          coverage run --source PowerViolenceObjects -m unittest discover tests
          coverage xml -i
      - name: Upload report to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
